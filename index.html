<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Tyre | Heavy Duty Division</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <style>
        :root { --brand-red: #dc2626; --brand-black: #09090b; }
        body { 
            background: var(--brand-black); color: #fafafa; 
            background-image: url('https://www.transparenttextures.com/patterns/asphalt.png');
            background-attachment: fixed; font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .glass { background: rgba(15, 15, 18, 0.98); backdrop-filter: blur(12px); border: 1px solid rgba(220, 38, 38, 0.2); }
        .hero-bg { background: linear-gradient(180deg, rgba(220,38,38,0.25) 0%, rgba(9,9,11,1) 100%); }
        .product-card { transition: all 0.4s ease; }
        .product-card:hover { transform: translateY(-8px); border-color: var(--brand-red); box-shadow: 0 15px 30px rgba(220, 38, 38, 0.15); }
        .form-input { background: #18181b; border: 1px solid #27272a; border-radius: 0.75rem; color: white; font-weight: 700; transition: 0.3s; }
        .form-input:focus { border-color: var(--brand-red); outline: none; box-shadow: 0 0 10px rgba(220, 38, 38, 0.2); }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='red' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--brand-black); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; background-image: url('https://www.transparenttextures.com/patterns/asphalt.png'); transition: opacity 0.8s ease, visibility 0.8s ease; }
        .tire-spinner { width: 100px; height: 100px; border: 12px dashed #27272a; border-top-color: var(--brand-red); border-bottom-color: var(--brand-red); border-radius: 50%; animation: spin 1.5s linear infinite; position: relative; box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 20px rgba(220, 38, 38, 0.3); }
        .tire-spinner::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: #18181b; border: 4px solid #3f3f46; border-radius: 50%; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Estilos del modal del carrito */
        #cart-modal { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .cart-open { transform: translateX(0%); }
        .cart-closed { transform: translateX(100%); }
        .cart-overlay { transition: opacity 0.4s ease; }
        .overlay-open { opacity: 1; pointer-events: auto; }
        .overlay-closed { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="antialiased">

    <div id="loader">

                        <option value="Beni">Beni</option>
                        <option value="Pando">Pando</option>
                        <option value="Oruro">Oruro</option>
                        <option value="Potosí">Potosí</option>
                        <option value="Tarija">Tarija</option>
                        <option value="Chuquisaca">Chuquisaca</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-zinc-500 uppercase tracking-widest">Ciudad</label>
                    <select id="ciudad" class="form-input p-3 w-full text-xs">
                        <option value="Santa Cruz de la Sierra">Santa Cruz de la Sierra</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center gap-3 mb-6 bg-zinc-900 p-3 rounded-xl border border-white/5">

                Enviar Pedido a WhatsApp
            </button>
        </div>
    </div>
