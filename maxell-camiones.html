<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxell Camiones | División Heavy Duty Bolivia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <style>
        :root { --maxell-green: #22c55e; }
        body { 
            background: #09090b; color: #fafafa; 
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            font-family: 'Inter', sans-serif;
        }
        .glass { background: rgba(15, 15, 18, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .truck-gradient { background: linear-gradient(180deg, rgba(34, 197, 94, 0.15) 0%, rgba(9, 9, 11, 0) 100%); }
        .product-card { transition: all 0.4s ease; }
        .product-card:hover { transform: translateY(-10px); border-color: var(--maxell-green); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <section class="relative h-[50vh] flex items-center justify-center overflow-hidden truck-gradient">
        <div class="text-center z-10 px-6" data-aos="fade-up">
            <h1 class="text-6xl md:text-8xl font-black italic tracking-tighter uppercase mb-2">MAXELL<span class="text-green-500">.</span></h1>
            <p class="text-zinc-400 font-bold uppercase text-[10px] tracking-[0.5em]">Heavy Duty Truck Tires | Santa Cruz, Bolivia</p>
            <div class="mt-8 flex flex-wrap justify-center gap-4">
                <span class="bg-zinc-900/80 border border-green-500/30 px-4 py-2 rounded-full text-[9px] font-black text-green-500 uppercase italic">4 Correas de Acero</span>
                <span class="bg-zinc-900/80 border border-green-500/30 px-4 py-2 rounded-full text-[9px] font-black text-green-500 uppercase italic">Control térmico avanzado</span>
            </div>
        </div>
    </section>

    <div class="max-w-6xl mx-auto px-6 mb-12 -mt-10 relative z-30">
        <div class="glass p-4 rounded-[2rem] flex flex-col md:flex-row gap-4 items-center border border-white/10 shadow-2xl">
            <input type="text" id="searchInput" onkeyup="filtrar()" placeholder="Buscar medida (ej. 295/80)..." 
                   class="w-full md:w-1/2 bg-zinc-900/50 border-none rounded-xl p-4 text-sm font-bold focus:ring-2 focus:ring-green-500 outline-none">
            
            <div class="flex gap-2 overflow-x-auto no-scrollbar w-full md:w-1/2">
                <button onclick="filtrarPosicion('TODAS')" class="bg-green-500 text-black px-5 py-2 rounded-xl text-[10px] font-black uppercase whitespace-nowrap">Todas</button>
                <button onclick="filtrarPosicion('DIRECCIÓN')" class="bg-zinc-900 text-zinc-400 px-5 py-2 rounded-xl text-[10px] font-black uppercase whitespace-nowrap hover:text-white">Dirección</button>
                <button onclick="filtrarPosicion('TRACCIÓN')" class="bg-zinc-900 text-zinc-400 px-5 py-2 rounded-xl text-[10px] font-black uppercase whitespace-nowrap hover:text-white">Tracción</button>
                <button onclick="filtrarPosicion('FUERA DE CAMINO')" class="bg-zinc-900 text-zinc-400 px-5 py-2 rounded-xl text-[10px] font-black uppercase whitespace-nowrap hover:text-white">Mixta/Minería</button>
            </div>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-6 pb-20">
        <div id="grid-camion" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <footer class="max-w-6xl mx-auto px-6 py-12 border-t border-zinc-900 text-center space-y-8">
        <div class="flex flex-col md:flex-row justify-center items-center gap-10">
            <div class="text-center md:text-left">
                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-[0.3em] mb-1">Centro de Distribución</p>
                <p class="text-sm font-bold text-zinc-300">Santa Cruz de la Sierra, Bolivia</p>
            </div>
            <div class="text-center md:text-left">
                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-[0.3em] mb-1">Contacto Flotas</p>
                <p class="text-sm font-bold text-zinc-300">+591 71483922</p>
            </div>
        </div>
        <div class="flex justify-center items-center gap-4 pt-4 border-t border-zinc-900/50">
            <p class="text-[9px] text-zinc-700 font-black uppercase tracking-[0.5em]">© 2026 GRUPO LIMEX SRL | DERECHOS RESERVADOS</p>
        </div>
    </footer>

    <script>
        // BASE DE DATOS INTEGRADA (Extraída de tu PDF)
        const CATALOGO_MAXELL = [
            { medida: "295/80R22.5 MA100", precio: 1850, posicion: "DIRECCIÓN", desc: "4 Correas de acero para máxima estabilidad." },
            { medida: "295/80R22.5 MS200", precio: 1920, posicion: "TRACCIÓN", desc: "Diseño de tracción profunda con control de calor." },
            { medida: "12R22.5 MA100", precio: 1980, posicion: "DIRECCIÓN", desc: "Reforzada para trayectos largos y pesados." },
            { medida: "12R22.5 MS200", precio: 2050, posicion: "TRACCIÓN", desc: "Máximo agarre en rutas de alta exigencia." },
            { medida: "315/80R22.5 MA100", precio: 2150, posicion: "DIRECCIÓN", desc: "Alta capacidad de carga y resistencia a impactos." },
            { medida: "13R22.5 MO300", precio: 2300, posicion: "FUERA DE CAMINO", desc: "Uso mixto/minero. Resistente a cortes y barro." }
        ];

        let productosFiltrados = [...CATALOGO_MAXELL];

        function init() {
            render(CATALOGO_MAXELL);
            AOS.init({ duration: 800, once: true });
        }

        function render(items) {
            const grid = document.getElementById('grid-camion');
            grid.innerHTML = items.map(l => `
                <div class="glass p-8 rounded-[2.5rem] border border-white/5 product-card" data-aos="zoom-in">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-green-500 text-[10px] font-black uppercase tracking-widest">${l.posicion}</span>
                        <span class="text-2xl font-black text-white tracking-tighter">${l.precio} BS</span>
                    </div>
                    <h3 class="text-2xl font-black text-white mb-2 italic uppercase">${l.medida}</h3>
                    <p class="text-zinc-500 text-[11px] mb-8 font-medium leading-relaxed uppercase">${l.desc}</p>
                    <button onclick="solicitarWA('${l.medida}')" class="w-full bg-white text-black hover:bg-green-600 hover:text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest transition-all active:scale-95 shadow-xl">
                        Cotizar para mi Flota
                    </button>
                </div>
            `).join('');
        }

        function filtrar() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            productosFiltrados = CATALOGO_MAXELL.filter(p => p.medida.toLowerCase().includes(term));
            render(productosFiltrados);
        }

        function filtrarPosicion(pos) {
            const term = document.getElementById('searchInput').value.toLowerCase();
            let base = CATALOGO_MAXELL.filter(p => p.medida.toLowerCase().includes(term));
            
            if(pos !== 'TODAS') {
                base = base.filter(p => p.posicion === pos);
            }
            render(base);
        }

        function solicitarWA(medida) {
            const msg = `Hola, solicito cotización corporativa para llantas de camión Maxell:\n📦 Medida: ${medida}\n📍 Ubicación: Santa Cruz`;
            window.open(`https://wa.me/59171483922?text=${encodeURIComponent(msg)}`, '_blank');
        }

        init();
    </script>
</body>
</html>
